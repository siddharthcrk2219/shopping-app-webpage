{% extends 'base.html' %}{% block content %}<section class="form-shell"><p class="eyebrow">01 WRITE · 02 CHECK · 03 PUBLISH</p><h1>Your experience matters.</h1><p>Reviewing <a href="{{ url_for('detail',pid=p.id) }}">{{ p.title }}</a></p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="title">Review title</label><input id="title" name="title" maxlength="120" required value="{{ request.form.get('title','') }}"><label for="rating">Your rating</label><select id="rating" name="rating" required><option value="">Choose a rating</option>{% for n in range(5,0,-1) %}<option value="{{ n }}" {% if request.form.get('rating')==n|string %}selected{% endif %}>{{ n }} / 5</option>{% endfor %}</select><label for="body">Your review</label><textarea id="body" name="body" rows="7" minlength="10" maxlength="5000" required placeholder="What did you think of the fit, fabric and feel?">{{ request.form.get('body','') }}</textarea><p class="muted">Next, a model will suggest a recommendation. You choose the final answer.</p><button>Preview recommendation →</button></form></section>{% endblock %}
